services:
  strava-kudos:
    image: mcr.microsoft.com/playwright/python:v1.49.1-jammy
    container_name: strava-kudos
    restart: unless-stopped
    init: true
    shm_size: 1gb
    working_dir: /app
    volumes:
      - ./:/app
    env_file: .env
    environment:
      TZ: Europe/Warsaw
      RUN_AT: "23:10 07:05"
    command: bash scheduler.sh
