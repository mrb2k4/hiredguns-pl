services:
  strava-kudos:
    image: mcr.microsoft.com/playwright/python:v1.49.1-jammy
    container_name: strava-kudos
    restart: unless-stopped
    init: true
    shm_size: 1gb
    working_dir: /app
    volumes:
      - ./:/app
    env_file: .env
    environment:
      TZ: Europe/Warsaw
      WINDOWS: "07:00-09:00 23:00-01:00"
    command: sh -c "python -c 'import playwright' 2>/dev/null || pip install -q -r requirements.txt; exec python -u scheduler.py"
